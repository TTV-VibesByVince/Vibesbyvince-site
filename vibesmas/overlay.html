<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibesmas leaderboard overlay</title>
<meta name="robots" content="noindex, nofollow">
<!--
  OBS browser source for the Vibesmas leaderboard.
  Add a Browser source with this URL, width 1920, height 1080.
  Options (add to the URL):
    ?rows=5        how many duos to show (3 to 10)
    &side=left     put the panel on the left instead of the right
  The background is transparent, so gameplay shows through.
-->
<style>
@font-face { font-family: 'Inter'; font-weight: 400 600; font-display: swap; src: url('/assets/fonts/inter-latin.woff2') format('woff2'); }
@font-face { font-family: 'Rajdhani'; font-weight: 700; font-display: swap; src: url('/assets/fonts/rajdhani-700-latin.woff2') format('woff2'); }
html, body { margin: 0; background: transparent; overflow: hidden; }
body { font-family: 'Inter', system-ui, sans-serif; color: #f1ecf7; }
.panel {
  position: absolute; top: 40px; right: 40px; width: 460px;
  border-radius: 22px; background: rgba(12, 7, 20, 0.88);
  border: 1px solid rgba(185, 140, 255, 0.35);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.panel.left { right: auto; left: 40px; }
.lights { display: block; width: 460px; height: 30px; }
.bulb { animation: tw 2.8s ease-in-out infinite; }
.bulb:nth-of-type(3n) { animation-delay: .9s; }
.bulb:nth-of-type(3n+1) { animation-delay: 1.8s; }
@keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.inner { padding: 8px 26px 24px; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
h1 { margin: 0; font: 700 40px/0.9 'Rajdhani', sans-serif; text-transform: uppercase; }
.badge { padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 16px; white-space: nowrap; background: rgba(185,140,255,.2); color: #e6d8ff; }
.badge.live { background: rgba(232, 54, 79, 0.22); color: #ffc2cb; }
.badge.review { background: rgba(245, 196, 81, 0.2); color: #f7dc9a; }
.badge.final { background: rgba(47, 168, 102, 0.22); color: #a6ecc4; }
.cane { height: 6px; border-radius: 999px; background: repeating-linear-gradient(-45deg, #e8364f 0 12px, #fbf4f6 12px 24px); }
ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
li { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.04); transition: transform .5s cubic-bezier(.16,1,.3,1); }
li.first { background: rgba(245, 196, 81, 0.12); }
.rank { width: 30px; font: 700 28px 'Rajdhani', sans-serif; color: #cbbfdf; }
.r1 { color: #f5c451; } .r2 { color: #d9e3f0; } .r3 { color: #e0a77a; }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.who b { font-size: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 14px; color: #cbbfdf; }
.pts { font: 700 34px 'Rajdhani', sans-serif; font-variant-numeric: tabular-nums; }
.foot { margin: 0; font-size: 15px; color: #cbbfdf; }
.foot b { color: #f1ecf7; }
.empty { margin: 0; color: #cbbfdf; font-size: 17px; }
</style>
</head>
<body>
<section class="panel" id="panel" aria-label="Vibesmas leaderboard">
  <svg class="lights" aria-hidden="true" viewBox="0 0 460 30">
    <path d="M0 4 Q 57 24 115 6 T 230 6 T 345 6 T 460 4" fill="none" stroke="#2c3b2f" stroke-width="2"/>
    <ellipse class="bulb" cx="30" cy="16" rx="5" ry="7.5" fill="#e8364f"/>
    <ellipse class="bulb" cx="86" cy="16" rx="5" ry="7.5" fill="#2fa866"/>
    <ellipse class="bulb" cx="143" cy="15" rx="5" ry="7.5" fill="#f5c451"/>
    <ellipse class="bulb" cx="200" cy="16" rx="5" ry="7.5" fill="#5aa9ff"/>
    <ellipse class="bulb" cx="258" cy="16" rx="5" ry="7.5" fill="#e8364f"/>
    <ellipse class="bulb" cx="315" cy="15" rx="5" ry="7.5" fill="#2fa866"/>
    <ellipse class="bulb" cx="372" cy="16" rx="5" ry="7.5" fill="#f5c451"/>
    <ellipse class="bulb" cx="430" cy="16" rx="5" ry="7.5" fill="#5aa9ff"/>
  </svg>
  <div class="inner">
    <div class="head">
      <h1>Vibesmas<br>Leaderboard</h1>
      <span class="badge" id="badge">Dec 12</span>
    </div>
    <div class="cane"></div>
    <ol id="list"></ol>
    <p class="empty" id="empty" hidden>Scores appear after game 1.</p>
    <p class="foot">Full standings at <b>vibesbyvince.com/vibesmas</b></p>
  </div>
</section>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const rows = Math.min(10, Math.max(3, parseInt(params.get('rows') || '5', 10) || 5));
  if (params.get('side') === 'left') document.getElementById('panel').classList.add('left');

  function badge(s) {
    const b = document.getElementById('badge');
    b.className = `badge ${s.phase}`;
    if (s.phase === 'live') b.textContent = s.currentGame ? `Game ${s.currentGame} of ${s.games}` : 'Live';
    else if (s.phase === 'review') b.textContent = 'Under review';
    else if (s.phase === 'final') b.textContent = 'Final';
    else b.textContent = 'Dec 12';
  }

  function render(s) {
    badge(s);
    const list = document.getElementById('list');
    list.textContent = '';
    const scored = s.published.length > 0;
    document.getElementById('empty').hidden = scored;
    if (!scored) return;
    s.standings.slice(0, rows).forEach((d, i) => {
      const li = document.createElement('li');
      if (d.rank === 1) li.className = 'first';
      const rank = document.createElement('span');
      rank.className = `rank${d.rank <= 3 ? ` r${d.rank}` : ''}`;
      rank.textContent = d.rank;
      const who = document.createElement('div');
      who.className = 'who';
      const b = document.createElement('b');
      b.textContent = d.name;
      const sm = document.createElement('span');
      sm.textContent = `${d.kills} kills`;
      who.append(b, sm);
      const pts = document.createElement('span');
      pts.className = 'pts';
      pts.textContent = d.total;
      li.append(rank, who, pts);
      list.append(li);
    });
  }

  async function load() {
    try {
      const res = await fetch('/api/vibesmas', { cache: 'no-store' });
      if (res.ok) render(await res.json());
    } catch {}
  }
  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
